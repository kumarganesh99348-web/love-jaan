<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>✨ The Universe Chose You</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Georgia',serif;cursor:pointer}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%}
  .msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;pointer-events:none;width:90%}
  .line{font-size:clamp(1.2rem,4vw,2rem);color:#fff;opacity:0;transition:opacity 1.5s ease;margin:12px 0;text-shadow:0 0 20px rgba(255,200,255,0.8);font-style:italic}
  .line.gold{color:#ffd700;font-size:clamp(1.4rem,5vw,2.4rem);text-shadow:0 0 30px rgba(255,215,0,0.9)}
  .tap-hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:0.9rem;animation:blink 1.5s infinite;z-index:10;background:rgba(255,107,157,0.15);padding:10px 24px;border-radius:50px;border:1px solid rgba(255,107,157,0.3);backdrop-filter:blur(8px)}
  @keyframes blink{0%,100%{opacity:0.3}50%{opacity:0.8}}
  .next-btn{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:16px 48px;border-radius:50px;background:linear-gradient(135deg,#ff6b9d,#c2185b);color:#fff;border:none;font-size:1.1rem;cursor:pointer;opacity:0;transition:opacity 1s ease;font-family:'Georgia',serif;box-shadow:0 6px 30px rgba(255,77,125,0.5);z-index:10}
  .next-btn:hover{transform:translateX(-50%) translateY(-3px) scale(1.05)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="msg" id="msg">
  <div class="line" id="l1">Among billions of people...</div>
  <div class="line gold" id="l2">...the universe chose us to meet, my jaan. 💫</div>
  <div class="line" id="l3">And I am grateful every single day, sweetheart.</div>
</div>
<div class="tap-hint" id="tapHint">👆 Tap anywhere to begin ✨</div>
<button class="next-btn" id="nextBtn" onclick="location.href='index.html'">Begin Your Surprise, Jeenee 💖</button>
<script src="shared.js"></script>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

const W=canvas.width, H=canvas.height;
const stars=[];
const heartPoints=[];
let phase=0; // 0=waiting, 1=stars appearing, 2=text, 3=heart formation, 4=done

// Generate heart shape points
function heartX(t){ return 16*Math.pow(Math.sin(t),3); }
function heartY(t){ return -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); }
const heartScale=Math.min(W,H)*0.022;
const heartCX=W/2, heartCY=H/2;
for(let t=0;t<Math.PI*2;t+=0.08){
  heartPoints.push({x:heartCX+heartX(t)*heartScale, y:heartCY+heartY(t)*heartScale});
}

class Star{
  constructor(x,y,targetX,targetY){
    this.x=x; this.y=y;
    this.ox=x; this.oy=y;
    this.tx=targetX||x; this.ty=targetY||y;
    this.size=Math.random()*2+0.5;
    this.opacity=0;
    this.twinkleSpeed=0.02+Math.random()*0.03;
    this.twinkleOffset=Math.random()*Math.PI*2;
    this.color=`hsl(${200+Math.random()*160},80%,${70+Math.random()*30}%)`;
    this.moving=false;
  }
  update(t){
    this.opacity=Math.min(1,this.opacity+0.015);
    if(this.moving){
      this.x+=(this.tx-this.x)*0.04;
      this.y+=(this.ty-this.y)*0.04;
    }
  }
  draw(){
    const twinkle=0.6+0.4*Math.sin(Date.now()*this.twinkleSpeed+this.twinkleOffset);
    ctx.save();
    ctx.globalAlpha=this.opacity*twinkle;
    ctx.fillStyle=this.color;
    ctx.shadowBlur=6; ctx.shadowColor=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// Spawn random stars
function spawnRandomStars(n){
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      stars.push(new Star(Math.random()*W, Math.random()*H));
    }, i*30);
  }
}

// Shooting star
function shootingStar(){
  const sx=Math.random()*W*0.5, sy=Math.random()*H*0.3;
  const len=120+Math.random()*80;
  let prog=0;
  const angle=Math.PI/6+Math.random()*0.3;
  function draw(){
    if(prog>1) return;
    ctx.save();
    ctx.globalAlpha=(1-prog)*0.8;
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.shadowBlur=8; ctx.shadowColor='#fff';
    ctx.beginPath();
    ctx.moveTo(sx+Math.cos(angle)*len*prog, sy+Math.sin(angle)*len*prog);
    ctx.lineTo(sx+Math.cos(angle)*len*(prog-0.15), sy+Math.sin(angle)*len*(prog-0.15));
    ctx.stroke();
    ctx.restore();
    prog+=0.025;
    requestAnimationFrame(draw);
  }
  draw();
}

let started=false;
document.body.addEventListener('click',()=>{
  if(started) return;
  started=true;
  document.getElementById('tapHint').style.display='none';
  phase=1;

  // Phase 1: stars appear
  spawnRandomStars(300);

  // Phase 2: text fades in
  setTimeout(()=>{
    document.getElementById('l1').style.opacity='1';
    setTimeout(()=>{ document.getElementById('l2').style.opacity='1'; },2000);
    setTimeout(()=>{ document.getElementById('l3').style.opacity='1'; },4000);
  },3000);

  // Shooting stars
  setTimeout(()=>shootingStar(),2000);
  setTimeout(()=>shootingStar(),5000);
  setTimeout(()=>shootingStar(),8000);

  // Phase 3: stars form heart
  setTimeout(()=>{
    document.getElementById('msg').style.opacity='0';
    document.getElementById('msg').style.transition='opacity 1s ease';
    // Assign heart targets to existing stars
    stars.forEach((s,i)=>{
      const hp=heartPoints[i%heartPoints.length];
      s.tx=hp.x+(Math.random()-0.5)*20;
      s.ty=hp.y+(Math.random()-0.5)*20;
      s.moving=true;
      s.color='#ff6b9d';
    });
    // Add more stars for heart density
    for(let i=0;i<heartPoints.length*2;i++){
      const hp=heartPoints[i%heartPoints.length];
      const s=new Star(Math.random()*W,Math.random()*H,hp.x+(Math.random()-0.5)*15,hp.y+(Math.random()-0.5)*15);
      s.opacity=1; s.color='#ff6b9d'; s.moving=true; s.size=1.5+Math.random()*2;
      stars.push(s);
    }
  },7000);

  // Phase 4: show button
  setTimeout(()=>{
    document.getElementById('nextBtn').style.opacity='1';
  },10000);
});

function animate(){
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ s.update(); s.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
