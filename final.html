<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>💖 The End</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Georgia',serif}
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@1&display=swap');

  .heart-container{position:relative;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}

  /* Growing heart */
  .big-heart{font-size:2rem;position:absolute;animation:heartGrow 4s ease-in-out 1s forwards;opacity:0;filter:drop-shadow(0 0 20px rgba(255,107,157,0.8))}
  @keyframes heartGrow{
    0%  {opacity:0;font-size:1rem}
    20% {opacity:1;font-size:3rem}
    60% {font-size:8rem;filter:drop-shadow(0 0 60px rgba(255,107,157,1))}
    80% {font-size:6rem;opacity:1}
    100%{font-size:5rem;opacity:0.3}
  }

  /* Heartbeat pulse on body */
  .heartbeat-bg{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(255,107,157,0) 0%,transparent 70%);animation:heartbeatBg 1s ease-in-out 3s 3}
  @keyframes heartbeatBg{0%,100%{background:radial-gradient(circle at center,rgba(255,107,157,0) 0%,transparent 70%)}50%{background:radial-gradient(circle at center,rgba(255,107,157,0.15) 40%,transparent 70%)}}

  /* Final message */
  .final-text{position:absolute;text-align:center;width:90%;max-width:500px;opacity:0;animation:textReveal 2s ease 5s forwards}
  @keyframes textReveal{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
  .final-line1{font-family:'Dancing Script',cursive;font-size:clamp(1.4rem,5vw,2.2rem);color:rgba(255,200,220,0.9);margin-bottom:16px;text-shadow:0 0 20px rgba(255,107,157,0.5)}
  .final-line2{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(0.9rem,2.5vw,1.1rem);color:rgba(255,255,255,0.6);line-height:1.8;margin-bottom:32px}
  .final-heart{font-size:2rem;animation:finalHeartbeat 1s ease-in-out infinite;display:block;margin-bottom:24px}
  @keyframes finalHeartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.2)}70%{transform:scale(1)}}

  .restart-btn{padding:14px 40px;border-radius:50px;background:linear-gradient(135deg,#ff6b9d,#c2185b);color:#fff;border:none;font-size:1rem;cursor:pointer;font-family:'Georgia',serif;box-shadow:0 4px 20px rgba(255,77,125,0.4);transition:all 0.3s;opacity:0;animation:textReveal 1s ease 7s forwards}
  .restart-btn:hover{transform:translateY(-3px) scale(1.05)}

  /* Stars */
  .star-bg{position:fixed;inset:0;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:0.1}50%{opacity:0.7}}

  /* Fade in from black */
  .fade-in{animation:fadeFromBlack 2s ease forwards}
  @keyframes fadeFromBlack{from{opacity:0}to{opacity:1}}
</style>
</head>
<body class="fade-in">
<div class="heartbeat-bg"></div>
<div class="star-bg" id="starBg"></div>

<div class="heart-container">
  <div class="big-heart">💖</div>
  <div class="final-text">
    <span class="final-heart">💖</span>
    <div class="final-line1">"Thank you for opening this little surprise, Jeenee, my sweetheart."</div>
    <div class="final-line2">
      Every page, every word, every animation —<br/>
      made with nothing but love, bubu.<br/>
      You deserve all of this and so much more. 🌹
    </div>
    <button class="restart-btn" onclick="location.href='universe.html'">Start Over From The Beginning 💫</button>
  </div>
</div>

<script>
// Stars
const sb=document.getElementById('starBg');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  sb.appendChild(s);
}

// Vibrate on heart grow (mobile)
setTimeout(()=>{
  if(navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
},3000);
</script>
</body>
</html>
